<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой Погодник</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .weather-app {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: #2c3e50;
            font-weight: 700;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 i {
            color: #3498db;
        }

        .search-container {
            display: flex;
            gap: 10px;
            flex-grow: 1;
            max-width: 400px;
        }

        #city-input {
            flex-grow: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        #city-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        #search-btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #search-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        .units-toggle {
            display: flex;
            background-color: #f1f5f9;
            border-radius: 12px;
            padding: 4px;
            margin-left: 10px;
        }

        .unit-btn {
            padding: 8px 16px;
            border: none;
            background: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .unit-btn.active {
            background-color: #3498db;
            color: white;
        }

        .current-weather {
            background: linear-gradient(to right, #3498db, #2c80b9);
            border-radius: 18px;
            padding: 30px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
        }

        .location {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .city-name {
            font-size: 2rem;
            font-weight: 700;
        }

        .date-time {
            font-size: 1rem;
            opacity: 0.9;
        }

        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .temperature {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .weather-description {
            font-size: 1.5rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .weather-details {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 10px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .forecast {
            margin-top: 30px;
        }

        .forecast-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .forecast-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .forecast-day {
            background-color: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s;
        }

        .forecast-day:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.05);
        }

        .forecast-date {
            font-weight: 600;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .forecast-icon {
            font-size: 2.5rem;
            margin: 10px 0;
            color: #3498db;
        }

        .forecast-temp {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .temp-high {
            font-weight: 700;
            color: #e74c3c;
        }

        .temp-low {
            font-weight: 600;
            color: #3498db;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #7f8c8d;
        }

        .error {
            background-color: #ffeaea;
            color: #e74c3c;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .weather-app {
                padding: 20px;
            }
            
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-container {
                max-width: 100%;
            }
            
            .temperature {
                font-size: 4rem;
            }
            
            .forecast-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .forecast-container {
                grid-template-columns: 1fr;
            }
            
            .weather-main {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .temperature {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="weather-app">
        <div class="header">
            <h1><i class="fas fa-cloud-sun"></i> Простой Погодник</h1>
            <div class="search-container">
                <input type="text" id="city-input" placeholder="Введите город..." value="Москва">
                <button id="search-btn">
                    <i class="fas fa-search"></i> Поиск
                </button>
            </div>
            <div class="units-toggle">
                <button class="unit-btn active" data-unit="metric">°C</button>
                <button class="unit-btn" data-unit="imperial">°F</button>
            </div>
        </div>

        <div class="current-weather">
            <div class="location">
                <div>
                    <div class="city-name">Москва, Россия</div>
                    <div class="date-time" id="current-date">Понедельник, 1 января 2024</div>
                </div>
                <div class="weather-icon" id="current-icon">
                    <i class="fas fa-sun fa-3x"></i>
                </div>
            </div>
            
            <div class="weather-main">
                <div class="temperature">+15°C</div>
                <div class="weather-info">
                    <div class="weather-description" id="weather-description">Солнечно</div>
                    <div class="weather-details">
                        <div class="detail-item">
                            <i class="fas fa-wind"></i>
                            <span id="wind-speed">5 км/ч</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-tint"></i>
                            <span id="humidity">65%</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-tachometer-alt"></i>
                            <span id="pressure">1013 гПа</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="forecast">
            <h2 class="forecast-title">Прогноз на 5 дней</h2>
            <div class="forecast-container" id="forecast-container">
                <!-- Прогноз загружается динамически -->
                <div class="loading">Загрузка прогноза погоды...</div>
            </div>
        </div>

        <div class="error" id="error-message">
            Не удалось получить данные о погоде. Пожалуйста, проверьте название города и попробуйте снова.
        </div>

        <footer>
            <p>Данные о погоде обновляются в реальном времени</p>
        </footer>
    </div>

    <script>
        // Конфигурация приложения
        const config = {
            apiKey: 'd7c6e8b6c9b0451c8b9b91e3a9e1b2a1', // Это демо-ключ, в реальном приложении нужно использовать свой
            baseUrl: 'https://api.openweathermap.org/data/2.5/',
            units: 'metric',
            lang: 'ru'
        };

        // Элементы DOM
        const cityInput = document.getElementById('city-input');
        const searchBtn = document.getElementById('search-btn');
        const unitBtns = document.querySelectorAll('.unit-btn');
        const cityNameEl = document.querySelector('.city-name');
        const currentDateEl = document.getElementById('current-date');
        const currentIconEl = document.getElementById('current-icon');
        const temperatureEl = document.querySelector('.temperature');
        const weatherDescriptionEl = document.getElementById('weather-description');
        const windSpeedEl = document.getElementById('wind-speed');
        const humidityEl = document.getElementById('humidity');
        const pressureEl = document.getElementById('pressure');
        const forecastContainer = document.getElementById('forecast-container');
        const errorMessage = document.getElementById('error-message');

        // Текущее состояние
        let currentCity = 'Москва';
        let currentUnit = 'metric';

        // Инициализация приложения
        document.addEventListener('DOMContentLoaded', () => {
            updateDateTime();
            getWeatherData(currentCity);
            
            // Обновляем время каждую минуту
            setInterval(updateDateTime, 60000);
        });

        // Обновление даты и времени
        function updateDateTime() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            currentDateEl.textContent = now.toLocaleDateString('ru-RU', options);
        }

        // Обработчик поиска
        searchBtn.addEventListener('click', () => {
            const city = cityInput.value.trim();
            if (city) {
                currentCity = city;
                getWeatherData(city);
            }
        });

        // Поиск по нажатию Enter
        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchBtn.click();
            }
        });

        // Переключение единиц измерения
        unitBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Убираем активный класс у всех кнопок
                unitBtns.forEach(b => b.classList.remove('active'));
                // Добавляем активный класс нажатой кнопке
                btn.classList.add('active');
                
                // Меняем единицы измерения
                currentUnit = btn.dataset.unit;
                getWeatherData(currentCity);
            });
        });

        // Получение данных о погоде
        async function getWeatherData(city) {
            try {
                // Скрываем сообщение об ошибке
                errorMessage.style.display = 'none';
                
                // Показываем индикатор загрузки
                forecastContainer.innerHTML = '<div class="loading">Загрузка данных о погоде...</div>';
                
                // Получаем текущую погоду
                const currentWeatherUrl = `${config.baseUrl}weather?q=${encodeURIComponent(city)}&units=${currentUnit}&lang=${config.lang}&appid=${config.apiKey}`;
                const currentResponse = await fetch(currentWeatherUrl);
                
                if (!currentResponse.ok) {
                    throw new Error('Город не найден');
                }
                
                const currentData = await currentResponse.json();
                
                // Получаем прогноз на 5 дней
                const forecastUrl = `${config.baseUrl}forecast?q=${encodeURIComponent(city)}&units=${currentUnit}&lang=${config.lang}&cnt=5&appid=${config.apiKey}`;
                const forecastResponse = await fetch(forecastUrl);
                
                if (!forecastResponse.ok) {
                    throw new Error('Не удалось получить прогноз');
                }
                
                const forecastData = await forecastResponse.json();
                
                // Обновляем интерфейс
                updateCurrentWeather(currentData);
                updateForecast(forecastData);
                
            } catch (error) {
                console.error('Ошибка получения данных:', error);
                showError('Не удалось получить данные о погоде. Пожалуйста, проверьте название города и попробуйте снова.');
            }
        }

        // Обновление текущей погоды
        function updateCurrentWeather(data) {
            // Обновляем название города и страны
            cityNameEl.textContent = `${data.name}, ${data.sys.country}`;
            
            // Температура
            const temp = Math.round(data.main.temp);
            const tempSymbol = currentUnit === 'metric' ? '°C' : '°F';
            temperatureEl.textContent = `${temp > 0 ? '+' : ''}${temp}${tempSymbol}`;
            
            // Описание погоды
            weatherDescriptionEl.textContent = data.weather[0].description;
            
            // Иконка погоды
            const iconClass = getWeatherIcon(data.weather[0].id, data.weather[0].icon);
            currentIconEl.innerHTML = `<i class="fas ${iconClass} fa-3x"></i>`;
            
            // Детали погоды
            const windSpeed = currentUnit === 'metric' 
                ? `${Math.round(data.wind.speed)} км/ч` 
                : `${Math.round(data.wind.speed)} миль/ч`;
                
            windSpeedEl.textContent = windSpeed;
            humidityEl.textContent = `${data.main.humidity}%`;
            pressureEl.textContent = `${data.main.pressure} гПа`;
        }

        // Обновление прогноза
        function updateForecast(data) {
            // Очищаем контейнер
            forecastContainer.innerHTML = '';
            
            // Берем по одному прогнозу на день (каждые 24 часа)
            const dailyForecasts = data.list.filter((item, index) => index % 8 === 0).slice(0, 5);
            
            // Создаем элементы прогноза
            dailyForecasts.forEach(day => {
                const date = new Date(day.dt * 1000);
                const dayName = date.toLocaleDateString('ru-RU', { weekday: 'short' });
                const dayNumber = date.getDate();
                const month = date.toLocaleDateString('ru-RU', { month: 'short' });
                
                const tempMax = Math.round(day.main.temp_max);
                const tempMin = Math.round(day.main.temp_min);
                const tempSymbol = currentUnit === 'metric' ? '°C' : '°F';
                
                const iconClass = getWeatherIcon(day.weather[0].id, day.weather[0].icon);
                
                const forecastDay = document.createElement('div');
                forecastDay.className = 'forecast-day';
                forecastDay.innerHTML = `
                    <div class="forecast-date">${dayName}, ${dayNumber} ${month}</div>
                    <div class="forecast-icon">
                        <i class="fas ${iconClass}"></i>
                    </div>
                    <div class="weather-description">${day.weather[0].description}</div>
                    <div class="forecast-temp">
                        <span class="temp-high">${tempMax > 0 ? '+' : ''}${tempMax}${tempSymbol}</span>
                        <span class="temp-low">${tempMin > 0 ? '+' : ''}${tempMin}${tempSymbol}</span>
                    </div>
                `;
                
                forecastContainer.appendChild(forecastDay);
            });
        }

        // Получение иконки погоды по коду
        function getWeatherIcon(weatherId, iconCode) {
            // Определяем время суток по коду иконки
            const isDay = iconCode.includes('d');
            
            // Группируем коды погоды по типам
            if (weatherId >= 200 && weatherId < 300) {
                // Гроза
                return isDay ? 'fa-bolt' : 'fa-bolt';
            } else if (weatherId >= 300 && weatherId < 400) {
                // Морось
                return 'fa-cloud-rain';
            } else if (weatherId >= 500 && weatherId < 600) {
                // Дождь
                return isDay ? 'fa-cloud-sun-rain' : 'fa-cloud-moon-rain';
            } else if (weatherId >= 600 && weatherId < 700) {
                // Снег
                return 'fa-snowflake';
            } else if (weatherId >= 700 && weatherId < 800) {
                // Атмосферные явления
                return 'fa-smog';
            } else if (weatherId === 800) {
                // Ясно
                return isDay ? 'fa-sun' : 'fa-moon';
            } else if (weatherId > 800 && weatherId < 900) {
                // Облачно
                return isDay ? 'fa-cloud-sun' : 'fa-cloud-moon';
            } else {
                return 'fa-cloud';
            }
        }

        // Показать сообщение об ошибке
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            forecastContainer.innerHTML = '';
        }

        // Пример данных для демонстрации (если API не работает)
        function loadDemoData() {
            // Текущая погода
            const currentData = {
                name: "Москва",
                sys: { country: "RU" },
                main: {
                    temp: 15,
                    humidity: 65,
                    pressure: 1013
                },
                weather: [{ id: 800, description: "Солнечно", icon: "01d" }],
                wind: { speed: 5 }
            };
            
            updateCurrentWeather(currentData);
            
            // Прогноз
            const forecastData = {
                list: [
                    { dt: Date.now()/1000 + 86400, main: { temp_max: 18, temp_min: 10 }, weather: [{ id: 800, description: "Солнечно", icon: "01d" }] },
                    { dt: Date.now()/1000 + 172800, main: { temp_max: 16, temp_min: 9 }, weather: [{ id: 801, description: "Малооблачно", icon: "02d" }] },
                    { dt: Date.now()/1000 + 259200, main: { temp_max: 14, temp_min: 8 }, weather: [{ id: 803, description: "Облачно", icon: "04d" }] },
                    { dt: Date.now()/1000 + 345600, main: { temp_max: 13, temp_min: 7 }, weather: [{ id: 500, description: "Небольшой дождь", icon: "10d" }] },
                    { dt: Date.now()/1000 + 432000, main: { temp_max: 17, temp_min: 10 }, weather: [{ id: 801, description: "Малооблачно", icon: "02d" }] }
                ]
            };
            
            updateForecast(forecastData);
        }

        // Если API не работает, загружаем демо-данные
        window.addEventListener('error', loadDemoData);
    </script>
</body>
</html>
